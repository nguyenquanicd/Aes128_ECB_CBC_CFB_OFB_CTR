<text x="12" y="290" font-size="11" fill="#444">The example starts with an output/error record already valid. At E0, i_zeroize_req is sampled high; the same edge aborts work, clears sensitive state and output/error valid bits, and discards the pending error record. No error code is emitted; o_zeroize_done is high for the one-cycle interval immediately after E0. AES no-stall latency is L_PIPE=10.</text>
