<text x="104" y="1129" text-anchor="start">(m_aes128_256_batch_core)</text>
<rect x="430" y="1082" width="1480" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1107" text-anchor="start">Stores the selected AES key schedule and message context; controls modes, CTR, lane pipeline, result tap, errors, and zeroize. AES-128 uses 10</text>
<text x="434" y="1129" text-anchor="start">rounds; AES-256 uses 14.</text>
